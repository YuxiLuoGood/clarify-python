services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --root-path /api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped